[package]
name = "lily-contracts"
version = "0.1.0"
edition = "2021"
description = "Lily Protocol core contracts — keyed config plane"
license = "Apache-2.0"

[lib]
name = "lily_contracts"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
